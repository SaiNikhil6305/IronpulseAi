services:
  - type: web
    name: ironpulse-ai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: IRONPULSE_AI_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai_compatible
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: llama-3.3-70b-versatile
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_MESSAGE_LIMIT
        value: "200"
